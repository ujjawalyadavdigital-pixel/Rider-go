<title>RiderGo Delivery App</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,500;12..96,700;12..96,800&family=DM+Sans:wght@400;500;700&family=JetBrains+Mono:wght@500;700&display=swap">
<style>
/* Layout: phone-shaped shell. Colored hero band at the top of key screens, a rounded white sheet sliding over it, a pinned action bar below. Red-to-orange identity with yellow highlights. */
:root{
  --bg:#F3E9E4; --surface:#FFFDFB; --panel:#FAF1EC; --ink:#25140F; --muted:#715D56;
  --line:#EFE1DA; --line2:#D9C3B9; --accent:#D93A2C; --accent-ink:#FFFFFF; --soft:#FDE4DF;
  --warm:#EC6A12; --warm-soft:#FFE9D6; --warm-ink:#A34505; --sun:#FFC22E; --sun-soft:#FFF3CF; --sun-ink:#6B4A00;
  --deep:#7C1F16; --good:#1E8449; --good-soft:#DDF3E5; --bad:#B3261E;
  --hero1:#CF2C20; --hero2:#EE6A14;
  --map:#F4ECE5; --road:#FFFFFF; --block:#E9DDD3; --park:#D6E6C9; --water:#CFE2EA;
  --shadow:0 10px 28px rgba(120,40,20,.14);
  --display:'Bricolage Grotesque','Trebuchet MS',sans-serif;
  --body:'DM Sans',system-ui,-apple-system,'Segoe UI',sans-serif;
  --mono:'JetBrains Mono',ui-monospace,Menlo,monospace;
}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){
  --bg:#0F0807; --surface:#1B100E; --panel:#271815; --ink:#F8EBE6; --muted:#BDA39B;
  --line:#37231F; --line2:#533A32; --accent:#FF6A57; --accent-ink:#240603; --soft:#40201B;
  --warm:#FF9A3D; --warm-soft:#3F2813; --warm-ink:#FFB873; --sun:#FFD25E; --sun-soft:#3E3213; --sun-ink:#FFE08A;
  --deep:#FFB4A8; --good:#52C484; --good-soft:#163524; --bad:#F08074;
  --hero1:#B8261B; --hero2:#D9531A;
  --map:#221614; --road:#33211D; --block:#2B1C19; --park:#1F3322; --water:#1C2B33;
  --shadow:0 10px 28px rgba(0,0,0,.45); color-scheme:dark}}
:root[data-theme="dark"]{
  --bg:#0F0807; --surface:#1B100E; --panel:#271815; --ink:#F8EBE6; --muted:#BDA39B;
  --line:#37231F; --line2:#533A32; --accent:#FF6A57; --accent-ink:#240603; --soft:#40201B;
  --warm:#FF9A3D; --warm-soft:#3F2813; --warm-ink:#FFB873; --sun:#FFD25E; --sun-soft:#3E3213; --sun-ink:#FFE08A;
  --deep:#FFB4A8; --good:#52C484; --good-soft:#163524; --bad:#F08074;
  --hero1:#B8261B; --hero2:#D9531A;
  --map:#221614; --road:#33211D; --block:#2B1C19; --park:#1F3322; --water:#1C2B33;
  --shadow:0 10px 28px rgba(0,0,0,.45); color-scheme:dark}

*{box-sizing:border-box}
html,body{height:100%}
body{margin:0;background:var(--bg);color:var(--ink);font-family:var(--body);font-size:15px;line-height:1.4;
  padding-block:14px;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}
h1,h2,h3,p{margin:0}
button{font:inherit;color:inherit;cursor:pointer}
:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
.app{position:relative;height:100%;max-height:840px;max-width:410px;margin:0 auto;background:var(--surface);
  border:1px solid var(--line);border-radius:34px;display:flex;flex-direction:column;overflow:hidden;box-shadow:var(--shadow)}
@media (max-width:440px){
  body{background:var(--surface);padding-block:0}
  .app{border:0;border-radius:0;max-height:none;max-width:none;box-shadow:none}
  .sb{display:none!important}
}

/* header */
.head{background:var(--surface);flex:none}
.sb{display:flex;justify-content:space-between;align-items:center;padding:12px 24px 0;font:700 13px var(--mono)}
.sb svg{display:block}
.top{display:flex;align-items:center;gap:10px;padding:10px 16px 10px;min-width:0}
.top .tt{flex:1;min-width:0}
.top .k{font:700 10.5px/1 var(--mono);letter-spacing:.09em;text-transform:uppercase;opacity:.75}
.top .n{font:700 16px/1.2 var(--display);white-space:nowrap;overflow:hidden;text-overflow:ellipsis;margin-top:5px}
.ib{width:38px;height:38px;border-radius:12px;border:1px solid var(--line2);background:transparent;display:grid;place-items:center;flex:none;color:inherit}
.ib.invis{visibility:hidden}
.chip{border:1px solid var(--line2);background:transparent;border-radius:999px;padding:8px 13px;font-size:13px;font-weight:700;white-space:nowrap;color:inherit}
.chip:hover,.ib:hover{background:var(--panel)}
.seg5{display:grid;grid-template-columns:repeat(5,1fr);gap:5px;padding:0 16px 12px}
.seg5 i{display:block;height:4px;border-radius:4px;background:var(--line);overflow:hidden}
.seg5 b{display:block;height:100%;background:var(--accent);border-radius:4px;transition:width .35s}
.app[data-mode="hero"] .head{background:var(--hero1);color:#fff}
.app[data-mode="hero"] .chip,.app[data-mode="hero"] .ib{border-color:rgba(255,255,255,.45)}
.app[data-mode="hero"] .chip:hover,.app[data-mode="hero"] .ib:hover{background:rgba(255,255,255,.16)}
.app[data-mode="hero"] .seg5 i{background:rgba(255,255,255,.3)}
.app[data-mode="hero"] .seg5 b{background:#fff}
.app[data-mode="bare"] .head,.app[data-mode="bare"] .bar{display:none}

/* screen + bar */
.screen{flex:1;min-height:0;min-width:0;overflow:auto;padding:12px 16px 12px;display:flex;flex-direction:column;gap:14px}
.screen.flush{padding:0;gap:0}
.screen>*,.sheetbody>*{animation:rise .42s cubic-bezier(.2,.7,.2,1) both}
.screen>*:nth-child(2),.sheetbody>*:nth-child(2){animation-delay:.05s}
.screen>*:nth-child(3),.sheetbody>*:nth-child(3){animation-delay:.1s}
.screen>*:nth-child(4),.sheetbody>*:nth-child(4){animation-delay:.15s}
.sheetbody>*:nth-child(5){animation-delay:.2s}.sheetbody>*:nth-child(6){animation-delay:.25s}
@keyframes rise{from{opacity:0;transform:translateY(12px)}to{opacity:1;transform:none}}
.bar{flex:none;display:flex;flex-direction:column;gap:8px;padding:12px 16px 16px;background:var(--surface);border-top:1px solid var(--line)}
.bar:empty{display:none}
.btn{width:100%;display:flex;align-items:center;justify-content:center;gap:10px;border:0;border-radius:16px;background:var(--accent);color:var(--accent-ink);
  font:700 17px var(--display);letter-spacing:.005em;padding:15px 18px;min-height:56px;
  box-shadow:0 8px 18px color-mix(in srgb,var(--accent) 32%,transparent)}
.btn:active{transform:translateY(1px)}
.btn:disabled{opacity:.38;cursor:not-allowed;box-shadow:none}
.btn.ghost{background:transparent;color:var(--ink);border:1.5px solid var(--line2);box-shadow:none;font:700 15px var(--body);min-height:48px;padding:11px 16px}
.btn.sm{width:auto;min-height:0;padding:9px 16px;font:700 14px var(--body);border-radius:12px;box-shadow:none}

/* type */
.h1{font:800 29px/1.08 var(--display);letter-spacing:-.015em;text-wrap:balance}
.h2{font:700 19px/1.2 var(--display);letter-spacing:-.005em}
.h1w{font:800 28px/1.08 var(--display);letter-spacing:-.015em;text-wrap:balance}
.bigw{font:800 52px/1 var(--display);letter-spacing:-.02em;font-variant-numeric:tabular-nums}
.big{font:800 36px/1 var(--display);font-variant-numeric:tabular-nums;letter-spacing:-.01em}
.op{opacity:.86}
.sub{color:var(--muted)}
.muted{color:var(--muted)}
.small{font-size:13px}
.mono{font-family:var(--mono);font-variant-numeric:tabular-nums}
.lbl{display:block;font:700 10.5px/1 var(--mono);letter-spacing:.09em;text-transform:uppercase;color:var(--muted);margin-bottom:8px}
.hint{font-size:13px;color:var(--muted)}
.err{color:var(--bad);font-weight:700}
.linkbtn{background:none;border:0;color:var(--muted);font-weight:700;font-size:12px;padding:6px 0;text-decoration:underline;text-underline-offset:3px;word-break:break-all;text-align:left}

/* hero + sheet */
.hero{position:relative;overflow:hidden;background:linear-gradient(180deg,var(--hero1),var(--hero2));color:#fff;padding:8px 16px 58px;flex:none}
.hero::after{content:"";position:absolute;inset:0;pointer-events:none;background-image:radial-gradient(rgba(255,255,255,.2) 1.3px,transparent 1.8px);background-size:15px 15px;
  -webkit-mask-image:linear-gradient(100deg,transparent 35%,#000);mask-image:linear-gradient(100deg,transparent 35%,#000)}
.hero>*{position:relative;z-index:1}
.sheetbody{position:relative;flex:1;min-width:0;margin-top:-30px;background:var(--surface);border-radius:30px 30px 0 0;padding:22px 16px 14px;display:flex;flex-direction:column;gap:14px}

/* pieces */
.row{display:flex;align-items:center;gap:12px;min-width:0}
.grow{flex:1;min-width:0}
.between{display:flex;align-items:center;justify-content:space-between;gap:12px}
.between.top{align-items:flex-start}
.card{background:var(--panel);border-radius:20px;padding:15px}
.card.line{background:transparent;border:1px solid var(--line)}
.pill{display:inline-flex;align-items:center;gap:6px;padding:5px 11px;border-radius:999px;font-size:12px;font-weight:700;background:var(--soft);color:var(--accent);white-space:nowrap}
.pill.warm{background:var(--warm-soft);color:var(--warm-ink)}
.pill.sun{background:var(--sun-soft);color:var(--sun-ink)}
.pill.good{background:var(--good-soft);color:var(--good)}
.pill.w{background:rgba(255,255,255,.2);color:#fff}
.grid2{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.grid3{display:grid;grid-template-columns:repeat(3,1fr);gap:8px}
.stat{background:var(--panel);border-radius:16px;padding:12px;min-width:0}
.stat .v{font:700 20px/1.1 var(--display);margin-top:6px;font-variant-numeric:tabular-nums;white-space:nowrap}
.stat .l{font-size:12px;color:var(--muted)}
.meter{height:9px;border-radius:99px;background:var(--line);overflow:hidden}
.meter i{display:block;height:100%;background:var(--sun);border-radius:99px;transition:width .3s}
.ico{flex:none;display:block}
.circle{width:44px;height:44px;border-radius:50%;display:grid;place-items:center;background:var(--soft);color:var(--accent);flex:none}
.circle.warm{background:var(--warm-soft);color:var(--warm)}
.circle.sun{background:var(--sun-soft);color:var(--sun-ink)}
.circle.done{background:var(--good);color:#fff}
.avatar{width:46px;height:46px;border-radius:50%;background:#fff;color:var(--hero1);display:grid;place-items:center;font:800 20px var(--display);flex:none}
.kv{display:flex;align-items:center;justify-content:space-between;gap:12px;padding:12px 0;border-bottom:1px dashed var(--line2)}
.kv:last-child{border-bottom:0}
.dot{width:10px;height:10px;border-radius:50%;flex:none}
.tog{display:inline-flex;align-items:center;gap:9px;border:0;background:rgba(255,255,255,.2);color:#fff;border-radius:999px;padding:6px 12px 6px 6px;font-weight:700;font-size:13px}
.tog i{width:30px;height:18px;border-radius:99px;background:rgba(255,255,255,.4);position:relative;display:block}
.tog i::after{content:"";position:absolute;left:2px;top:2px;width:14px;height:14px;border-radius:50%;background:#fff}

/* inputs */
.otpb{display:grid;grid-template-columns:repeat(4,1fr);gap:10px}
.otpb input{width:100%;min-width:0;height:62px;text-align:center;font:700 27px var(--mono);border:1.5px solid var(--line2);border-radius:16px;background:var(--surface);color:var(--ink);outline:0}
.otpb input:focus{border-color:var(--accent);box-shadow:0 0 0 4px var(--soft)}
.otpb.bad input{border-color:var(--bad)}
.otpb.bad{animation:shake .35s}
@keyframes shake{20%,60%{transform:translateX(-6px)}40%,80%{transform:translateX(6px)}}
.field{display:flex;align-items:center;gap:10px;border:1.5px solid var(--line2);border-radius:16px;padding:0 14px;background:var(--surface)}
.field:focus-within{border-color:var(--accent);box-shadow:0 0 0 4px var(--soft)}
.field .pre{display:flex;align-items:center;gap:8px;padding-right:12px;border-right:1px solid var(--line2);font:700 16px var(--mono);height:30px}
.field input{flex:1;min-width:0;border:0;outline:0;background:transparent;color:var(--ink);font:600 21px var(--mono);padding:16px 0;letter-spacing:.04em}

/* ticket */
.ticket{background:var(--panel);border-radius:22px;position:relative}
.ticket .tp{padding:16px}
.ticket .perf{position:relative;margin:0 20px;border-top:2px dashed var(--line2)}
.ticket .perf::before,.ticket .perf::after{content:"";position:absolute;top:-11px;width:20px;height:20px;border-radius:50%;background:var(--surface)}
.ticket .perf::before{left:-30px}.ticket .perf::after{right:-30px}
.items{list-style:none;margin:0;padding:0}
.items li{display:flex;align-items:center;gap:12px;padding:10px 0;border-bottom:1px dashed var(--line2);min-width:0}
.items li:last-child{border-bottom:0}
.qty{font:700 13px var(--mono);background:var(--surface);border-radius:9px;padding:4px 9px;border:1px solid var(--line2)}

/* checklist, timeline, chips */
.check{display:flex;align-items:center;gap:14px;padding:13px 0;border-bottom:1px dashed var(--line2);cursor:pointer}
.check:last-child{border-bottom:0}
.check input{appearance:none;-webkit-appearance:none;width:26px;height:26px;border-radius:9px;border:2px solid var(--line2);background:var(--surface);flex:none;display:grid;place-items:center;margin:0}
.check input:checked{background:var(--accent);border-color:var(--accent)}
.check input:checked::after{content:"";width:6px;height:11px;border:solid var(--accent-ink);border-width:0 3px 3px 0;transform:rotate(45deg) translate(-1px,-1px)}
.check input:checked+span{color:var(--muted);text-decoration:line-through}
.tl{display:flex;flex-direction:column}
.tl div{display:flex;gap:14px;align-items:center;padding:8px 0;color:var(--muted);position:relative}
.tl div::before{content:"";position:absolute;left:6px;top:-14px;height:28px;border-left:2px solid var(--line2);z-index:0}
.tl div:first-child::before{display:none}
.tl i{width:14px;height:14px;border-radius:50%;border:2px solid var(--line2);background:var(--surface);flex:none;position:relative;z-index:1}
.tl div.on{color:var(--ink);font-weight:700}
.tl div.on::before{border-color:var(--good)}
.tl div.on i{background:var(--good);border-color:var(--good)}
.chips{display:flex;flex-wrap:wrap;gap:8px}
.chips button{border:1.5px solid var(--line2);background:transparent;border-radius:999px;padding:10px 15px;font-size:14px;font-weight:500}
.chips button[aria-pressed="true"]{background:var(--accent);color:var(--accent-ink);border-color:var(--accent)}
.seg{display:grid;grid-template-columns:1fr 1fr;background:var(--panel);border-radius:14px;padding:4px;gap:4px}
.seg button{border:0;background:transparent;border-radius:11px;padding:11px;font-weight:700;color:var(--muted)}
.seg button[aria-pressed="true"]{background:var(--surface);color:var(--ink);box-shadow:0 2px 8px rgba(0,0,0,.1),0 0 0 1px var(--line2)}
.stack{display:flex;gap:3px;height:16px}
.stack i{display:block;border-radius:6px;min-width:6px}

/* slide to confirm */
.slide{position:relative;height:64px;border-radius:20px;background:var(--soft);overflow:hidden;user-select:none;-webkit-user-select:none}
.sfill{position:absolute;left:0;top:0;bottom:0;width:0;background:var(--accent);opacity:.22}
.stext{position:absolute;inset:0;display:grid;place-items:center;padding-left:48px;font:700 16px var(--display);color:var(--accent)}
.knob{position:absolute;left:4px;top:4px;width:56px;height:56px;border-radius:16px;background:var(--accent);color:var(--accent-ink);display:grid;place-items:center;touch-action:none;cursor:grab;box-shadow:0 6px 14px color-mix(in srgb,var(--accent) 35%,transparent)}
.slide.ok .stext{color:var(--accent-ink)}.slide.ok .sfill{opacity:1}

/* map */
.mapwrap{position:relative;background:var(--map);flex:none}
.mapwrap svg{display:block;width:100%;height:auto}
.mapov{position:absolute;left:12px;right:12px;top:12px;display:flex;justify-content:space-between;gap:8px}
.chip2{display:inline-flex;align-items:center;gap:6px;background:var(--surface);color:var(--ink);border:0;border-radius:999px;padding:8px 13px;font-size:12px;font-weight:700;box-shadow:0 4px 14px rgba(0,0,0,.18)}
.msheet{position:relative;flex:1;margin-top:-26px;background:var(--surface);border-radius:28px 28px 0 0;padding:10px 16px 16px;display:flex;flex-direction:column;gap:14px;box-shadow:0 -10px 24px rgba(0,0,0,.1)}
.grab{width:40px;height:4px;border-radius:4px;background:var(--line2);margin:0 auto 2px}
.etab{text-align:right;flex:none}
.etab b{display:block;font:800 26px/1 var(--display);color:var(--accent);font-variant-numeric:tabular-nums}
.etab span{font-size:12px;color:var(--muted)}
.pulse{transform-box:fill-box;transform-origin:center;animation:pl 1.8s ease-out infinite}
@keyframes pl{0%{transform:scale(.5);opacity:.6}100%{transform:scale(1.7);opacity:0}}

/* splash, radar, success */
.splash{flex:1;position:relative;overflow:hidden;background:linear-gradient(165deg,var(--hero1),var(--hero2) 62%,#F5A623);color:#fff;display:grid;place-content:center;justify-items:center;gap:8px;text-align:center;cursor:pointer}
.splash::before{content:"";position:absolute;inset:0;background-image:radial-gradient(rgba(255,255,255,.2) 1.4px,transparent 1.9px);background-size:16px 16px;-webkit-mask-image:radial-gradient(circle at 50% 45%,transparent 20%,#000 90%);mask-image:radial-gradient(circle at 50% 45%,transparent 20%,#000 90%)}
.splash>*{position:relative}
.logo{width:96px;height:96px;border-radius:30px;background:#fff;color:var(--hero1);display:grid;place-items:center;box-shadow:0 16px 36px rgba(60,10,0,.3);margin-bottom:10px}
.brand{font:800 42px/1 var(--display);letter-spacing:-.03em}
.load{width:120px;height:4px;border-radius:4px;background:rgba(255,255,255,.3);overflow:hidden;margin-top:28px}
.load i{display:block;height:100%;width:0;background:#fff;animation:ld 1.9s linear forwards}
@keyframes ld{to{width:100%}}
.power{width:172px;height:172px;border-radius:50%;border:0;margin:6px auto;background:linear-gradient(160deg,var(--hero2),var(--hero1));color:#fff;display:grid;place-content:center;justify-items:center;gap:6px;font:800 18px var(--display);box-shadow:0 0 0 12px var(--soft),0 0 0 28px color-mix(in srgb,var(--soft) 45%,transparent),0 18px 32px color-mix(in srgb,var(--accent) 40%,transparent)}
.radar{position:relative;width:172px;height:172px;margin:6px auto;display:grid;place-items:center}
.radar span{position:absolute;inset:0;border-radius:50%;border:2px solid var(--accent);opacity:0;animation:ping 2.4s infinite}
.radar span:nth-child(2){animation-delay:.8s}.radar span:nth-child(3){animation-delay:1.6s}
.radar .core{position:relative;width:78px;height:78px;border-radius:50%;background:linear-gradient(160deg,var(--hero2),var(--hero1));color:#fff;display:grid;place-items:center}
@keyframes ping{0%{transform:scale(.4);opacity:.7}100%{transform:scale(1.1);opacity:0}}
.ringw{position:relative;width:70px;height:70px;flex:none}
.ringw svg{width:70px;height:70px;transform:rotate(-90deg)}
.ringw b{position:absolute;inset:0;display:grid;place-items:center;font:800 22px var(--mono)}
.okc{width:92px;height:92px;margin:6px auto 0;display:block}
.okc circle{stroke-dasharray:151;stroke-dashoffset:151;animation:dr .6s .1s ease-out forwards}
.okc path{stroke-dasharray:40;stroke-dashoffset:40;animation:dr .4s .55s ease-out forwards}
@keyframes dr{to{stroke-dashoffset:0}}
.spin{width:14px;height:14px;border-radius:50%;border:2px solid currentColor;border-right-color:transparent;animation:sp .7s linear infinite;display:inline-block}
@keyframes sp{to{transform:rotate(360deg)}}

/* flow sheet + toast */
.sheet{position:absolute;inset:0;background:var(--surface);z-index:5;display:flex;flex-direction:column}
.sheet .list{flex:1;overflow:auto;padding:0 16px 18px}
.sheet .ph{font:700 10.5px var(--mono);letter-spacing:.09em;text-transform:uppercase;color:var(--muted);padding:16px 0 6px}
.sheet button.it{display:flex;align-items:center;gap:12px;width:100%;text-align:left;border:0;background:transparent;padding:10px 4px;border-bottom:1px solid var(--line)}
.sheet .num{font:700 12px var(--mono);width:30px;height:30px;border-radius:10px;display:grid;place-items:center;background:var(--panel);color:var(--muted);flex:none}
.sheet .it.done .num{background:var(--good-soft);color:var(--good)}
.sheet .it.cur .num{background:var(--accent);color:var(--accent-ink)}
.sheet .it.cur{font-weight:700}
.toast{position:absolute;left:16px;right:16px;bottom:96px;background:var(--ink);color:var(--surface);padding:13px 15px;border-radius:14px;font-weight:700;font-size:14px;z-index:6;text-align:center;animation:rise .25s both}
@media (prefers-reduced-motion:reduce){
  *,*::before,*::after{animation-duration:.01ms!important;animation-iteration-count:1!important;transition-duration:.01ms!important}
  .radar span{opacity:.35;transform:scale(.8)}
}
</style>

<script src="config.js"></script>
<div class="app" id="app" data-mode="bare">
  <div class="head" id="head">
    <div class="sb"><span id="clock">9:41</span>

class ApiError extends Error{constructor(m,c,s){super(m);this.code=c;this.status=s}}

async function api(method,path,body){
  if(!API_BASE)throw new ApiError('Set the server address first.','no_server',0);
  let res;
  try{res=await fetch(API_BASE.replace(/\/$/,'')+'/api'+path,{method,headers:{'Content-Type':'application/json',...(S.token?{Authorization:'Bearer '+S.token}:{})},body:body?JSON.stringify(body):undefined})}
  catch(_){throw new ApiError('Cannot reach the server. Check your connection and the server address.','network',0)}
  let data={};try{data=await res.json()}catch(_){}
  if(!res.ok){if(res.status===401&&S.token){S.token=null;store.set('ridergo_token',null)}throw new ApiError(data.error||'Something went wrong.',data.code||'error',res.status)}
  return data;
}

function bindOtp(id,cb){
  const box=$('#'+id),ins=[...box.querySelectorAll('input')],get=()=>ins.map(i=>i.value).join('');
  ins.forEach((el,i)=>{
    el.addEventListener('input',()=>{el.value=el.value.replace(/\D/g,'').slice(-1);if(el.value&&ins[i+1])ins[i+1].focus();box.classList.remove('bad');cb(get())});
    el.addEventListener('keydown',e=>{if(e.key==='Backspace'&&!el.value&&ins[i-1]){ins[i-1].value='';ins[i-1].focus();cb(get())}});
    el.addEventListener('paste',e=>{const t=((e.clipboardData||window.clipboardData).getData('text')||'').replace(/\D/g,'').slice(0,4);if(!t)return;e.preventDefault();ins.forEach((x,j)=>x.value=t[j]||'');ins[Math.min(t.length,3)].focus();cb(get())});
  });
  return {get,focus(){ins[0].focus()},bad(){box.classList.remove('bad');void box.offsetWidth;box.classList.add('bad');ins.forEach(x=>x.value='');ins[0].focus();cb('')}};
}
const slideHTML=label=>`<div class="slide" role="button" tabindex="0" aria-label="${label}"><div class="sfill"></div><div class="stext">${label}</div><div class="knob">${svg(P.arrow,26,2.6)}</div></div>`;
function bindSlide(done){
  const el=$('.slide'),knob=el.querySelector('.knob'),fill=el.querySelector('.sfill');
  let x0=null,max=0,x=0,fin=false;
  const set=(v,anim)=>{x=v;knob.style.transition=fill.style.transition=anim?'all .25s':'none';knob.style.transform=`translateX(${v}px)`;fill.style.width=(v+60)+'px'};
  const finish=()=>{if(fin)return;fin=true;max=el.clientWidth-64;set(max,true);el.classList.add('ok');T.t.push(setTimeout(done,260))};
  knob.addEventListener('pointerdown',e=>{max=el.clientWidth-64;x0=e.clientX-x;try{knob.setPointerCapture(e.pointerId)}catch(_){}});
  knob.addEventListener('pointermove',e=>{if(x0===null||fin)return;set(Math.max(0,Math.min(max,e.clientX-x0)),false)});
  const up=()=>{if(x0===null)return;x0=null;if(x>max*.85)finish();else set(0,true)};
  knob.addEventListener('pointerup',up);knob.addEventListener('pointercancel',up);
  el.addEventListener('keydown',e=>{if(e.key==='Enter'||e.key===' '){e.preventDefault();finish()}});
}

function mapSVG(kind){

  <rect width="360" height="300" fill="var(--map)"/>${blocks}
  <path d="M0 282C80 268 140 292 220 280S330 270 360 284" fill="none" stroke="var(--water)" stroke-width="16" stroke-linecap="round"/>
  <g stroke="var(--road)" stroke-width="8" stroke-linecap="round" fill="none"><path d="M0 50H360M0 100H360M0 120H360M0 140H360M0 190H360M0 220H360M0 260H360"/><path d="M40 0V300M90 0V300M120 0V300M200 0V300M230 0V300M310 0V300"/></g>
  <g font-family="JetBrains Mono,monospace" font-size="6.5" fill="var(--muted)" opacity=".85"><text x="132" y="142.5">MG ROAD</text><text x="236" y="222.5">LINK ROAD</text><text x="46" y="52.5">SECTOR 21</text></g>
  <path d="${route}" fill="none" stroke="#fff" stroke-width="13" stroke-linecap="round" stroke-linejoin="round" opacity=".9"/>
  <path id="route" d="${route}" fill="none" stroke="var(--accent)" stroke-width="7" stroke-linecap="round" stroke-linejoin="round"/>
  <path id="prog" d="${route}" fill="none" stroke="var(--line2)" stroke-width="7.5" stroke-linecap="round" stroke-linejoin="round" style="stroke-dashoffset:9999"/>
  ${dest}
  <g id="rider" transform="translate(${start[0]} ${start[1]})"><circle class="pulse" r="15" fill="var(--accent)"/><circle r="9" fill="var(--accent)" stroke="#fff" stroke-width="3"/></g>
  </svg>`;
}
function runMap(eta,km,done){
  const path=$('#route'),prog=$('#prog'),rider=$('#rider'),e=$('#eta'),k=$('#km'),L=path.getTotalLength();
  prog.style.strokeDasharray=L;
  const dur=matchMedia('(prefers-reduced-motion: reduce)').matches?1:5500,st=performance.now();T.skip=false;
  const tick=now=>{
    const p=T.skip?1:Math.min(1,(now-st)/dur),pt=path.getPointAtLength(L*p);
    rider.setAttribute('transform',`translate(${pt.x} ${pt.y})`);
    prog.style.strokeDashoffset=L*(1-p);
    e.textContent=p>=1?'Here':Math.max(1,Math.ceil(eta*(1-p)))+' min';
    k.textContent=(km*(1-p)).toFixed(1)+' km';
    if(p<1)T.raf=requestAnimationFrame(tick);else done();
  };
  T.raf=requestAnimationFrame(tick);
}

}

  app.dataset.mode=mode;
  screen.className='screen'+((v.hero||v.flush)?' flush':'');
  screen.innerHTML=v.body;bar.innerHTML=v.bar||'';
  $('#k').textContent='Step '+S.step+' of 21 · '+ph[0];$('#n').textContent=STEPS[S.step-1][0];
  $('#seg').innerHTML=PHASES.map(p=>{const f=Math.max(0,Math.min(1,(S.step-p[1]+1)/(p[2]-p[1]+1)));return `<i><b style="width:${f*100}%"></b></i>`}).join('');
  const back=$('#back');back.innerHTML=svg(P.chevL,20,2.4);back.classList.toggle('invis',true);
  $('#clock').textContent=new Date().toLocaleTimeString('en-IN',{hour:'numeric',minute:'2-digit',hour12:false});
  sheet.hidden=true;screen.scrollTop=0;
  if(v.after)v.after();
}
function toast(m){const t=document.createElement('div');t.className='toast';t.textContent=m;app.appendChild(t);setTimeout(()=>t.remove(),1900)}
function openFlow(){
  sheet.innerHTML=`<div class="head"><div class="top" style="padding-top:18px"><div class="tt"><div class="k">Rider flow</div><div class="n">All 21 steps</div></div><button class="chip" data-act="close">Close</button></div></div>
   <div class="list">${PHASES.map(p=>`<div class="ph">${p[0]}</div>`+STEPS.map((s,i)=>({s,n:i+1})).filter(o=>o.n>=p[1]&&o.n<=p[2]).map(o=>`<button class="it ${o.n<S.step?'done':o.n===S.step?'cur':''}" disabled><span class="num">${o.n<S.step?'✓':o.n}</span><span style="flex:1;min-width:0"><span style="display:block">${o.s[0]}</span><span class="small muted" style="font-weight:400">${o.s[1]}</span></span></button>`).join('')).join('')}</div>`;
  sheet.hidden=false;
}

async function resume(){
  if(S.sub.resuming)return;S.sub.resuming=true;
  if(!S.token){go(2);return}
  try{
    const d=await api('GET','/dashboard');S.dash=d;
    if(d.rider.status!=='active'){go(3);return}
    if(d.activeOrder){setOrder(d.activeOrder);go(STEP_FOR[d.activeOrder.status]||8);return}
    if(d.rider.online){S.online=true;go(5);return}
    go(4);
  }catch(e){if(e.status===401)go(2);else{go(2);toast(e.message)}}
}
const BEFORE={
  3:()=>api('POST','/profile/submit',{}),
  8:()=>api('POST','/orders/'+ORDER.id+'/arrive',{}),
  10:()=>api('POST','/orders/'+ORDER.id+'/verify-pickup',{skip:true}),
  15:()=>api('POST','/orders/'+ORDER.id+'/reached',{}),
  16:()=>api('POST','/orders/'+ORDER.id+'/deliver',{contactless:true}),
  18:async()=>{const r=await api('POST','/orders/'+ORDER.id+'/settle',{cashCollected:S.cod?S.cash:undefined});
    EARN=r.earnings.lines.map(l=>[l.label,l.amount]);EARN_TOTAL=r.earnings.total;S.today=r.today.earnings;S.deliveries=r.today.deliveries;S.cash=false},
  20:async()=>{const r=await api('POST','/shift/end',{});S.summary=r.summary;S.online=false},
};
async function handle(a,n,el){
  switch(a){
    case 'next':if(BEFORE[S.step])await BEFORE[S.step]();go(S.step+1);break;
    case 'resume':resume();break;
    case 'retry':render();break;
    case 'flow':openFlow();break;
    case 'close':sheet.hidden=true;break;
    case 'skip':T.skip=true;break;
    case 'server':S.serverOpen=!S.serverOpen;render();break;
    case 'saveserver':{const v=($('#server').value||'').trim().replace(/\/$/,'');if(!/^https?:\/\/.+/.test(v)){toast('Enter an address like http://192.168.1.10:3000');break}API_BASE=v;store.set('ridergo_api',v);S.serverOpen=false;render();toast('Server saved');break}
    case 'login':
      if(!S.otp){const r=await api('POST','/auth/send-otp',{phone:S.phone});S.demoOtp=r.demoOtp||'';S.otp=true;render()}
      else if(OT&&OT.get().length===4){const r=await api('POST','/auth/verify-otp',{phone:S.phone,otp:OT.get()});S.token=r.token;store.set('ridergo_token',r.token);S.rider=r.rider;S.otp=false;S.sub={};go(r.rider.status==='active'?4:3)}
      break;
    case 'editphone':S.otp=false;render();break;
    case 'doc':await api('POST','/documents/'+n,{fileName:n+'.jpg'});render();break;
    case 'docall':for(const d of ['id','dl','rc','selfie','bank'])if(S.docs[d]!==2)await api('POST','/documents/'+d,{fileName:d+'.jpg'});render();break;
    case 'power':await api('POST','/status',{online:true});S.online=true;go(5);break;
    case 'offline':await api('POST','/status',{online:false});S.online=false;go(5);break;
    case 'offline2':S.online=true;go(5);break;
    case 'accept':{const r=await api('POST','/orders/'+ORDER.id+'/accept',{});setOrder(r.order);go(7);break}
    case 'decline':await api('POST','/orders/'+ORDER.id+'/decline',{});S.online=true;go(5);break;
    case 'verify':if(OT&&OT.get().length===4){const r=await api('POST','/orders/'+ORDER.id+'/verify-pickup',{code:OT.get()});setOrder(r.order);go(11)}break;
    case 'dverify':if(OT&&OT.get().length===4){const r=await api('POST','/orders/'+ORDER.id+'/deliver',{otp:OT.get()});setOrder(r.order);go(17)}break;
    case 'call':toast('Calling '+ORDER.custName+' through a masked number');break;
    case 'chat':toast('Opening chat with '+ORDER.custName);break;
    case 'quick':await api('POST','/orders/'+ORDER.id+'/contact',{message:QUICK[+n]});S.msg=+n;render();toast('Message sent');break;
    case 'another':S.cash=false;S.msg=-1;S.online=true;go(5);break;
    case 'restart':go(1);break;
  }
}
document.addEventListener('click',async e=>{
  const el=e.target.closest('[data-act]');if(!el||el.disabled)return;
  const was=el.disabled;el.disabled=true;
  try{await handle(el.dataset.act,el.dataset.n,el)}catch(err){fail(err)}
  finally{if(el.isConnected&&(el.id!=='cta'||!el.dataset.keepOff))el.disabled=was}
});
render();
})();
</script>
